  <text x="301" y="482" text-anchor="middle" fill="#f8f6ef" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="4.2">COFFEE ROASTERS</text>
  <text x="300" y="525" text-anchor="middle" fill="#f8f6ef" opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing=".15">A broader body, peeling away into open air.</text>
