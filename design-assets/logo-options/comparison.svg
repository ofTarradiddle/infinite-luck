<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650" role="img" aria-label="Three Nectar steam logo studies: A Ribbon, B Drift and C Curl">
  <title>Nectar — three steam studies</title>
  <desc>Only the steam changes. The existing cup, horizontal inverted-F bar, three downward strokes, serif wordmark and frame stay consistent.</desc>
  <rect width="1800" height="650" fill="#161712"/>
  <text x="64" y="35" fill="#f8f6ef" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3">STEAM STUDIES</text>
  <text x="1736" y="35" text-anchor="end" fill="#f8f6ef" opacity=".6" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing=".7">SAME MARK. THREE WAYS TO DRIFT.</text>
<svg x="0" y="57" width="600" height="540" viewBox="0 0 600 540"><rect width="600" height="540" fill="#161712"/>
  <text x="64" y="32" fill="#f8f6ef" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3.2">A / RIBBON</text>
  <rect x="54.5" y="54.5" width="491" height="446" fill="none" stroke="#f8f6ef" stroke-width="1.15"/>
  <g transform="translate(107 112) scale(4.9)" color="#f8f6ef">
    <path data-original-cup-and-bar="true" d="M7 44h67M12 44V34M56 44v10m8-10v10m8-10v10M46 23c0 17 21 17 21 0M46 23c0-7 21-7 21 0s-21 7-21 0Zm21 1c12-6 11 10-3 10" fill="none" stroke="currentColor" stroke-width="2.1"/>
    <path data-steam-contour="true" d="M55.4 15.5C51.8 12.1 52.6 8 56.9 4.1C62.9-1.4 68.6-1.6 68.6-7.6C72.3-1 67 3.3 61.8 6.4C56.7 9.5 54.6 12 55.4 15.5Z" fill="none" stroke="currentColor" stroke-width=".82" stroke-linecap="round" stroke-linejoin="round"/>
    <path data-steam-inner="true" d="M55.4 12.3C55.1 8.7 59.6 5.9 63.4 3.6C67.1 1.4 69-1.3 69-3.6" fill="none" stroke="currentColor" stroke-width=".33" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  </g>
  <text x="297" y="456" text-anchor="middle" fill="#f8f6ef" font-family="Georgia, 'Times New Roman', serif" font-size="111" letter-spacing="-4.6">Nectar</text>
  <text x="301" y="482" text-anchor="middle" fill="#f8f6ef" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="4.2">COFFEE ROASTERS</text>
  <text x="300" y="525" text-anchor="middle" fill="#f8f6ef" opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing=".15">A tall ribbon, lifting and drifting to the right.</text></svg>
<svg x="600" y="57" width="600" height="540" viewBox="0 0 600 540"><rect width="600" height="540" fill="#161712"/>
  <text x="64" y="32" fill="#f8f6ef" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3.2">B / DRIFT</text>
  <rect x="54.5" y="54.5" width="491" height="446" fill="none" stroke="#f8f6ef" stroke-width="1.15"/>
  <g transform="translate(107 112) scale(4.9)" color="#f8f6ef">
    <path data-original-cup-and-bar="true" d="M7 44h67M12 44V34M56 44v10m8-10v10m8-10v10M46 23c0 17 21 17 21 0M46 23c0-7 21-7 21 0s-21 7-21 0Zm21 1c12-6 11 10-3 10" fill="none" stroke="currentColor" stroke-width="2.1"/>
    <path data-steam-contour="true" d="M55 15.4C51.5 12.2 52.1 7.1 58.8 5.7C65.8 4.2 72.2 7.1 78.5 4.8C82.3 3.4 85.1.1 86.5-3.8C86.5 2.2 82.5 7.5 76.5 9.2C68.7 11.6 61.1 8.2 57.7 10.8C56 12 55.2 13.6 55 15.4Z" fill="none" stroke="currentColor" stroke-width=".82" stroke-linecap="round" stroke-linejoin="round"/>
    <path data-steam-inner="true" d="M55.4 11.2C59.3 5.4 69.3 10 77.7 7.1C81.5 5.8 84 3.4 85 .9" fill="none" stroke="currentColor" stroke-width=".33" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  </g>
  <text x="297" y="456" text-anchor="middle" fill="#f8f6ef" font-family="Georgia, 'Times New Roman', serif" font-size="111" letter-spacing="-4.6">Nectar</text>
  <text x="301" y="482" text-anchor="middle" fill="#f8f6ef" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="4.2">COFFEE ROASTERS</text>
  <text x="300" y="525" text-anchor="middle" fill="#f8f6ef" opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing=".15">A broader body, peeling away into open air.</text></svg>
<svg x="1200" y="57" width="600" height="540" viewBox="0 0 600 540"><rect width="600" height="540" fill="#161712"/>
  <text x="64" y="32" fill="#f8f6ef" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3.2">C / CURL</text>
  <rect x="54.5" y="54.5" width="491" height="446" fill="none" stroke="#f8f6ef" stroke-width="1.15"/>
  <g transform="translate(107 112) scale(4.9)" color="#f8f6ef">
    <path data-original-cup-and-bar="true" d="M7 44h67M12 44V34M56 44v10m8-10v10m8-10v10M46 23c0 17 21 17 21 0M46 23c0-7 21-7 21 0s-21 7-21 0Zm21 1c12-6 11 10-3 10" fill="none" stroke="currentColor" stroke-width="2.1"/>
    <path data-steam-contour="true" d="M55.4 15.5C50.8 12 51.1 6.6 56.1 2.8C60.3-.4 63.5-3.1 60.3-7.3C67.9-5.2 70.5.9 66.5 5.4C64.7 7.4 61.2 7.9 60.6 10.3C60 12.7 61.4 14.1 59.7 15.6C58.6 16.6 56.6 16.4 55.4 15.5Z" fill="none" stroke="currentColor" stroke-width=".82" stroke-linecap="round" stroke-linejoin="round"/>
    <path data-steam-inner="true" d="M55.9 12.9C53.9 9.7 56.7 6.8 60.7 5.2C65.1 3.5 66.4.2 64.4-2.5M59 13.9C58.3 11.6 59.1 9.8 61.6 8.3" fill="none" stroke="currentColor" stroke-width=".33" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  </g>
  <text x="297" y="456" text-anchor="middle" fill="#f8f6ef" font-family="Georgia, 'Times New Roman', serif" font-size="111" letter-spacing="-4.6">Nectar</text>
  <text x="301" y="482" text-anchor="middle" fill="#f8f6ef" font-family="Arial, Helvetica, sans-serif" font-size="9.5" letter-spacing="4.2">COFFEE ROASTERS</text>
  <text x="300" y="525" text-anchor="middle" fill="#f8f6ef" opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing=".15">A sculptural curl with a quiet, calligraphic lift.</text></svg>
<text x="900" y="630" text-anchor="middle" fill="#f8f6ef" opacity=".6" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing=".5">The cup, bar and three downward strokes retain their original geometry. Only the steam is explored.</text>
</svg>
